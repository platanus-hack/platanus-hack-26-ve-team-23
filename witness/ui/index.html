<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>HAWK</title>
  <link rel="icon" href="hawk-mark.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/saira-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body class="booting">

<!-- Icons: one sprite, drawn with the page's ink. Nothing external. -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-mark" viewBox="0 0 60 36"><path d="M0 0 L24 5 L30 22 L36 5 L60 0 L30 36 Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="8" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.8"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.8"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.8"/></symbol>
  <symbol id="i-hosts" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.2"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-events" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-record" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-ask" viewBox="0 0 24 24"><path d="M9.2 9.2a2.9 2.9 0 1 1 4.1 2.6c-.8.4-1.3 1-1.3 1.9"/><circle cx="12" cy="17.2" r=".7" fill="currentColor"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".7" fill="currentColor"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.2c0 4.4-3 7.9-7 9.8-4-1.9-7-5.4-7-9.8V6z"/></symbol>
  <symbol id="i-approve" viewBox="0 0 24 24"><path d="M12 3l7 3v5.2c0 4.4-3 7.9-7 9.8-4-1.9-7-5.4-7-9.8V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.8"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-release" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 7.4-2.1"/></symbol>
  <symbol id="i-quarantine" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M6.2 6.2l11.6 11.6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M20 20l-4.3-4.3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-offline" viewBox="0 0 24 24"><path d="M9.5 14.5l-2.2 2.2a3.2 3.2 0 0 1-4.5-4.5l3-3M14.5 9.5l2.2-2.2a3.2 3.2 0 0 1 4.5 4.5l-3 3M4 4l16 16"/></symbol>
  <symbol id="i-net" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1.2"/><rect x="3" y="16" width="6" height="5" rx="1.2"/><rect x="15" y="16" width="6" height="5" rx="1.2"/><path d="M12 8v4M6 16v-4h12v4"/></symbol>
  <symbol id="i-chain" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
</svg>

<a class="skip" href="#main" data-i18n="a11y.skip"></a>

<div class="app" id="app">
  <!-- Desktop rail; on a phone the same entries become the tab bar below -->
  <aside class="rail" aria-label="HAWK">
    <div class="brand"><svg class="mark" viewBox="0 0 60 36" aria-hidden="true"><use href="#i-mark"/></svg><span>HAWK</span></div>
    <nav id="rail-nav" class="rail-nav" data-i18n-label="nav.label"></nav>
    <div class="rail-foot">
      <span class="live" id="rail-live"><i aria-hidden="true"></i><span id="rail-live-text"></span></span>
      <span class="muted" id="version"></span>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="brand brand-compact"><svg class="mark" viewBox="0 0 60 36" aria-hidden="true"><use href="#i-mark"/></svg></div>
      <h1 id="screen-title"></h1>
      <span class="pill-state" id="top-state" data-kind="good"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg><span id="top-state-text"></span></span>
    </header>

    <div id="banner" class="banner" role="alert" hidden>
      <svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>
      <p id="banner-text"></p>
      <button id="banner-retry" class="pill small ghost" type="button" hidden data-i18n="banner.retry"></button>
    </div>

    <main id="main" class="main" tabindex="-1">

      <!-- Resumen -->
      <section class="view" id="view-overview" data-view="overview" aria-labelledby="screen-title">
        <section id="asks" class="card asks" hidden aria-labelledby="h-asks">
          <div class="card-head">
            <h2 id="h-asks" data-i18n="asks.title"></h2>
            <span class="count" id="asks-count"></span>
          </div>
          <p class="note" data-i18n="asks.note"></p>
          <ul id="ask-list" class="stack"></ul>
        </section>

        <section id="hero" class="hero" data-kind="good" aria-label="HAWK">
          <div class="hero-main">
            <span class="hero-icon" aria-hidden="true"><svg class="ic" id="hero-icon"><use href="#i-shield"/></svg></span>
            <div class="hero-text" aria-live="polite">
              <h2 id="state-title"></h2>
              <p id="state-sub"></p>
            </div>
          </div>
          <dl class="hero-meta">
            <div><dt data-i18n="core.name"></dt><dd id="core-name"></dd></div>
            <div><dt data-i18n="core.fingerprint"></dt><dd><code id="core-fp"></code></dd></div>
            <div><dt data-i18n="core.link"></dt><dd data-i18n="core.linkValue"></dd></div>
            <div><dt data-i18n="core.updated"></dt><dd id="updated"></dd></div>
          </dl>
        </section>

        <section class="kpis" aria-label="Resumen" data-i18n-label="kpi.label">
          <div class="kpi lead"><span class="kpi-label" data-i18n="kpi.blocked"></span><span class="kpi-value" id="k-blocked">0</span><span class="kpi-sub" id="k-blocked-sub"></span></div>
          <div class="kpi"><span class="kpi-label" data-i18n="kpi.total"></span><span class="kpi-value" id="k-total">0</span><span class="kpi-sub" id="k-rate"></span></div>
          <div class="kpi"><span class="kpi-label" data-i18n="kpi.asked"></span><span class="kpi-value" id="k-ask">0</span><span class="kpi-sub" data-i18n="kpi.askedSub"></span></div>
          <div class="kpi"><span class="kpi-label" data-i18n="kpi.contained"></span><span class="kpi-value" id="k-contained">0</span><span class="kpi-sub" id="k-contained-sub"></span></div>
          <div class="kpi"><span class="kpi-label" data-i18n="kpi.integrity"></span><span class="kpi-value kpi-word" id="k-integrity">–</span><span class="kpi-sub" id="k-integrity-sub"></span></div>
        </section>

        <section class="card chart-card" id="chart-card" aria-labelledby="h-chart">
          <div class="card-head">
            <h2 id="h-chart" data-i18n="chart.title"></h2>
            <div class="card-tools">
              <div class="seg" id="range" role="group" data-i18n-label="range.label">
                <button type="button" data-min="15" aria-pressed="false">15 min</button>
                <button type="button" data-min="60" aria-pressed="true">1 h</button>
                <button type="button" data-min="360" aria-pressed="false">6 h</button>
                <button type="button" data-min="1440" aria-pressed="false">24 h</button>
              </div>
              <button id="chart-toggle" class="pill small ghost" type="button" aria-pressed="false" data-i18n="chart.asTable"></button>
            </div>
          </div>
          <div class="chart-wrap" id="chart-wrap">
            <svg id="chart" role="img" aria-labelledby="h-chart chart-desc" preserveAspectRatio="none"></svg>
            <div id="tooltip" class="tooltip" hidden></div>
          </div>
          <p class="sr" id="chart-desc"></p>
          <ul class="legend" id="legend" aria-label="Leyenda" data-i18n-label="chart.legend">
            <li><i class="sw allow" aria-hidden="true"></i><span data-i18n="verdict.allow"></span></li>
            <li><i class="sw ask" aria-hidden="true"></i><span data-i18n="verdict.ask"></span></li>
            <li><i class="sw deny" aria-hidden="true"></i><span data-i18n="verdict.deny"></span></li>
          </ul>
          <div class="table-wrap" id="chart-table-wrap" hidden>
            <table id="chart-table">
              <thead><tr><th scope="col" data-i18n="chart.from"></th><th scope="col" class="num" data-i18n="verdict.allow"></th><th scope="col" class="num" data-i18n="verdict.ask"></th><th scope="col" class="num" data-i18n="verdict.deny"></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <div class="two">
          <section class="card" aria-labelledby="h-rules">
            <div class="card-head"><h2 id="h-rules" data-i18n="rules.title"></h2></div>
            <ol id="rules" class="bars"></ol>
          </section>
          <section class="card" aria-labelledby="h-recent">
            <div class="card-head"><h2 id="h-recent" data-i18n="recent.title"></h2><button class="link" type="button" data-go="events" data-i18n="recent.all"></button></div>
            <ul id="recent" class="stack"></ul>
          </section>
        </div>
      </section>

      <!-- Equipos -->
      <section class="view" id="view-hosts" data-view="hosts" hidden aria-labelledby="screen-title">
        <div class="toolbar">
          <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span class="sr" data-i18n="hosts.searchLabel"></span><input id="host-filter" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="hosts.search"></label>
          <p class="toolbar-note" id="host-count"></p>
        </div>
        <ul id="host-list" class="hosts"></ul>
        <p id="hosts-empty" class="empty" hidden></p>
      </section>

      <!-- Eventos -->
      <section class="view" id="view-events" data-view="events" hidden aria-labelledby="screen-title">
        <div class="toolbar toolbar-filters">
          <label class="field"><span data-i18n="events.outcome"></span>
            <select id="f-outcome">
              <option value="" data-i18n="events.all"></option>
              <option value="allow" data-i18n="verdict.allow"></option>
              <option value="ask" data-i18n="verdict.ask"></option>
              <option value="deny" data-i18n="verdict.deny"></option>
              <option value="containment" data-i18n="verdict.contain"></option>
              <option value="alert" data-i18n="events.alerts"></option>
            </select>
          </label>
          <label class="field"><span data-i18n="events.severity"></span>
            <select id="f-severity">
              <option value="" data-i18n="events.any"></option>
              <option value="critical" data-i18n="sev.critical"></option>
              <option value="high" data-i18n="sev.high"></option>
              <option value="medium" data-i18n="sev.medium"></option>
              <option value="low" data-i18n="sev.low"></option>
            </select>
          </label>
          <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span class="sr" data-i18n="events.searchLabel"></span><input id="f-text" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="events.search"></label>
        </div>
        <p class="toolbar-note" id="events-count"></p>
        <ul id="event-list" class="events"></ul>
        <p id="events-empty" class="empty" hidden data-i18n="events.empty"></p>
        <button id="events-more" class="pill ghost" type="button" hidden></button>
      </section>

      <!-- Registro -->
      <section class="view" id="view-record" data-view="record" hidden aria-labelledby="screen-title">
        <section class="card" aria-labelledby="h-integrity">
          <div class="card-head"><h2 id="h-integrity" data-i18n="integrity.title"></h2><span id="identity-chip"></span></div>
          <p class="lead-line" id="integrity-sum"></p>
          <p class="note" data-i18n="integrity.how"></p>
          <ol id="heads" class="heads"></ol>
          <button id="heads-more" class="pill small ghost" type="button" hidden></button>
        </section>

        <section class="card" aria-labelledby="h-record">
          <div class="card-head"><h2 id="h-record" data-i18n="record.title"></h2></div>
          <p class="note" data-i18n="record.note"></p>
          <div class="row">
            <button id="open-record" class="pill primary" type="button" data-i18n="record.open"></button>
            <span id="record-status" class="status-line" role="status"></span>
          </div>
          <div id="record-tools" class="toolbar" hidden>
            <label class="field"><span data-i18n="record.kind"></span><select id="r-kind"></select></label>
            <p class="toolbar-note" id="record-count"></p>
          </div>
          <ol id="record-list" class="record"></ol>
        </section>
      </section>

      <!-- Ajustes -->
      <section class="view" id="view-settings" data-view="settings" hidden aria-labelledby="screen-title">
        <section class="card" aria-labelledby="h-set-core">
          <div class="card-head"><h2 id="h-set-core" data-i18n="settings.core"></h2></div>
          <dl class="kv">
            <div><dt data-i18n="core.name"></dt><dd id="set-core-name"></dd></div>
            <div><dt data-i18n="core.fingerprint"></dt><dd><code id="set-core-fp"></code></dd></div>
            <div><dt data-i18n="settings.firewall"></dt><dd id="set-firewall"></dd></div>
            <div><dt data-i18n="settings.thresholds"></dt><dd id="set-thresholds"></dd></div>
            <div><dt data-i18n="settings.events"></dt><dd id="set-events"></dd></div>
          </dl>
          <div class="row">
            <button id="reconfigure" class="pill ghost" type="button" data-i18n="settings.reconfigure"></button>
          </div>
        </section>

        <section class="card" aria-labelledby="h-set-dev">
          <div class="card-head"><h2 id="h-set-dev" data-i18n="settings.device"></h2></div>
          <dl class="kv">
            <div><dt data-i18n="settings.deviceFp"></dt><dd><code id="device-fp"></code></dd></div>
            <div><dt data-i18n="settings.keys"></dt><dd data-i18n="settings.keysValue"></dd></div>
          </dl>
          <p class="note" data-i18n="settings.deviceNote"></p>
        </section>

        <section class="card" aria-labelledby="h-set-look">
          <div class="card-head"><h2 id="h-set-look" data-i18n="settings.look"></h2></div>
          <div class="field-row">
            <span class="field-label" id="lbl-theme" data-i18n="settings.theme"></span>
            <div class="seg" id="theme-seg" role="group" aria-labelledby="lbl-theme">
              <button type="button" data-theme-choice="auto" aria-pressed="false" data-i18n="settings.themeAuto"></button>
              <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n="settings.themeLight"></button>
              <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n="settings.themeDark"></button>
            </div>
          </div>
          <div class="field-row">
            <span class="field-label" id="lbl-lang" data-i18n="settings.language"></span>
            <div class="seg" id="lang-seg" role="group" aria-labelledby="lbl-lang">
              <button type="button" data-lang-choice="es" aria-pressed="false">Español</button>
              <button type="button" data-lang-choice="en" aria-pressed="false">English</button>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="h-set-net">
          <div class="card-head"><h2 id="h-set-net" data-i18n="settings.network"></h2></div>
          <ul class="facts">
            <li><svg class="ic" aria-hidden="true"><use href="#i-net"/></svg><span data-i18n="settings.factQuic"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg><span data-i18n="settings.factPin"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-chain"/></svg><span data-i18n="settings.factChain"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-offline"/></svg><span data-i18n="settings.factOffline"></span></li>
          </ul>
        </section>

        <section class="card" aria-labelledby="h-set-scope">
          <div class="card-head"><h2 id="h-set-scope" data-i18n="scope.title"></h2></div>
          <h3 class="scope-h" data-i18n="scope.does"></h3>
          <ul class="facts">
            <li><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="scope.doesHook"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="scope.doesRules"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="scope.doesContain"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="scope.doesRecord"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="scope.doesFailClosed"></span></li>
          </ul>
          <h3 class="scope-h" data-i18n="scope.doesNot"></h3>
          <ul class="facts">
            <li><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg><span data-i18n="scope.notUnknown"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg><span data-i18n="scope.notModel"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg><span data-i18n="scope.notAgents"></span></li>
            <li><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg><span data-i18n="scope.notOutside"></span></li>
          </ul>
        </section>

        <section class="card danger" aria-labelledby="h-set-danger">
          <div class="card-head"><h2 id="h-set-danger" data-i18n="settings.change"></h2></div>
          <p class="note" data-i18n="settings.changeNote"></p>
          <div class="row"><button id="change-core" class="pill outline" type="button" data-i18n="settings.changeBtn"></button></div>
        </section>
      </section>
    </main>

    <nav id="tabbar" class="tabbar" data-i18n-label="nav.label"></nav>
  </div>
</div>

<!-- Activation (ADR-0024): find, verify, pair, configure -->
<div class="wizard" id="wizard" hidden role="dialog" aria-modal="true" aria-labelledby="wiz-title">
  <div class="wizard-inner">
    <header class="wiz-head">
      <div class="brand"><svg class="mark" viewBox="0 0 60 36" aria-hidden="true"><use href="#i-mark"/></svg><span>HAWK</span></div>
      <ol id="steps" class="steps">
        <li data-step="find"><span class="n">1</span><span class="l" data-i18n="wiz.stepFind"></span></li>
        <li data-step="verify"><span class="n">2</span><span class="l" data-i18n="wiz.stepVerify"></span></li>
        <li data-step="pair"><span class="n">3</span><span class="l" data-i18n="wiz.stepPair"></span></li>
        <li data-step="configure"><span class="n">4</span><span class="l" data-i18n="wiz.stepConfigure"></span></li>
      </ol>
    </header>

    <p id="wizard-error" class="form-error" role="alert" hidden></p>

    <section class="step" data-step="find">
      <h2 id="wiz-title" data-i18n="wiz.findTitle"></h2>
      <p class="lede" data-i18n="wiz.findText"></p>
      <div class="scan-line"><span class="spinner" id="scan-spinner" aria-hidden="true"></span><span id="scan-status" role="status"></span></div>
      <ul id="found" class="stack"></ul>
      <div class="row">
        <button id="scan" class="pill ghost" type="button" data-i18n="wiz.scanAgain"></button>
      </div>
      <details class="manual" id="manual">
        <summary data-i18n="wiz.manual"></summary>
        <p class="note" data-i18n="wiz.manualNote"></p>
        <form id="manual-form" class="inline-form" autocomplete="off">
          <label class="field grow"><span class="sr" data-i18n="wiz.manualLabel"></span><input id="manual-addr" type="text" inputmode="decimal" spellcheck="false" placeholder="192.168.88.20:7443" required></label>
          <button id="manual-go" class="pill primary" type="submit" data-i18n="wiz.manualGo"></button>
        </form>
      </details>
    </section>

    <section class="step" data-step="verify" hidden>
      <h2 data-i18n="wiz.verifyTitle"></h2>
      <p class="lede" data-i18n="wiz.verifyText"></p>
      <p class="bigcode"><code id="verify-fp"></code></p>
      <p class="note" data-i18n="wiz.verifyHint"></p>
      <div class="row">
        <button id="verify-ok" class="pill primary" type="button" data-i18n="wiz.verifyOk"></button>
        <button class="pill ghost" type="button" data-back="find" data-i18n="wiz.verifyNo"></button>
      </div>
    </section>

    <section class="step" data-step="pair" hidden>
      <h2 data-i18n="wiz.pairTitle"></h2>
      <p class="lede" id="pair-intro"></p>
      <p class="bigcode" id="pair-code-wrap" hidden><code id="pair-code"></code></p>
      <p class="note" id="pair-hint" hidden data-i18n="wiz.pairHint"></p>
      <div class="row">
        <button id="pair-ok" class="pill primary" type="button" hidden data-i18n="wiz.pairOk"></button>
        <button id="pair-no" class="pill ghost" type="button" hidden data-i18n="wiz.pairNo"></button>
        <button id="pair-retry" class="pill ghost" type="button" hidden data-back="find" data-i18n="wiz.pairBack"></button>
      </div>
    </section>

    <section class="step" data-step="configure" hidden>
      <h2 data-i18n="wiz.configTitle"></h2>
      <p class="lede" data-i18n="wiz.configText"></p>
      <div id="wizard-config"></div>
    </section>
  </div>
</div>

<!-- One form for the wizard and for Ajustes -->
<template id="tpl-config">
  <form class="config-form" autocomplete="off" novalidate>
    <label class="field"><span data-i18n="cfg.name"></span><input name="name" type="text" maxlength="48" required autocomplete="off" data-i18n-ph="cfg.namePh"></label>
    <label class="field"><span data-i18n="cfg.firewall"></span>
      <select name="fw">
        <option value="dry_run" data-i18n="cfg.fwDry"></option>
        <option value="mikrotik">MikroTik (RouterOS 7)</option>
        <option value="openwrt">OpenWrt</option>
      </select>
    </label>
    <p class="note" data-fw-note data-i18n="cfg.fwDryNote"></p>
    <div class="router" hidden>
      <label class="field"><span data-i18n="cfg.url"></span><input name="url" type="url" inputmode="url" spellcheck="false" placeholder="https://192.168.88.1" autocomplete="off"></label>
      <label class="field"><span data-i18n="cfg.user"></span><input name="user" type="text" spellcheck="false" autocomplete="off"></label>
      <label class="field"><span data-i18n="cfg.password"></span><input name="password" type="password" autocomplete="new-password"></label>
      <label class="field"><span data-i18n="cfg.cert"></span><input name="cert" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="cfg.certPh"></label>
      <label class="field" data-only="mikrotik"><span data-i18n="cfg.list"></span><input name="list" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="cfg.listPh"></label>
      <p class="note" data-i18n="cfg.secretNote"></p>
    </div>
    <fieldset class="thresholds">
      <legend data-i18n="cfg.attention"></legend>
      <label class="field"><span data-i18n="cfg.askFrom"></span>
        <select name="ask">
          <option value="low" data-i18n="sev.low"></option>
          <option value="medium" data-i18n="sev.medium"></option>
          <option value="high" data-i18n="sev.high"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="cfg.denyFrom"></span>
        <select name="deny">
          <option value="low" data-i18n="sev.low"></option>
          <option value="medium" data-i18n="sev.medium"></option>
          <option value="high" data-i18n="sev.high"></option>
          <option value="critical" data-i18n="cfg.denyCriticalOnly"></option>
        </select>
      </label>
      <p class="note" data-i18n="cfg.attentionNote"></p>
    </fieldset>
    <p class="form-error" role="alert" hidden></p>
    <div class="row">
      <button class="pill primary" type="submit" data-submit></button>
      <button class="pill ghost" type="button" data-skip hidden></button>
    </div>
  </form>
</template>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="icon-btn" type="button" data-i18n-label="a11y.close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
    <footer id="sheet-actions" class="sheet-actions"></footer>
  </div>
</dialog>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="kit.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
