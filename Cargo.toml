[workspace]
members = [
    "guardian-core",
    "detect",
    "llm-proxy",
    "edge-net",
    "guardian",
    "host-daemon",
    "eval",
    "witness",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["team-23"]
repository = "https://github.com/platanus-hack/platanus-hack-26-ve-team-23"
publish = false

[workspace.dependencies]
guardian-core = { path = "guardian-core" }
detect = { path = "detect" }
llm-proxy = { path = "llm-proxy" }
edge-net = { path = "edge-net" }

tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"

# Cryptography: established crates only, never our own primitives (ADR-0014).
ed25519-dalek = "2"
ml-dsa = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Lints shared by every crate. `cargo clippy -- -D warnings` turns every
# warning into an error in CI; tests may unwrap (see clippy.toml).
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
