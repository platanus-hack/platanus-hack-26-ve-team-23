# Release: build every downloadable file, attach it to the GitHub release of
# the tag, and redeploy the landing so it publishes them under /downloads/
# (ADR-0032). File names are fixed: misc/landing/install.sh depends on them.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  meta:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: The tag must equal the workspace version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v1.2.3: $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          workspace="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ "$version" = "$workspace" ] || { echo "tag $TAG but Cargo.toml says $workspace"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: daemon and Core (Linux)
    needs: meta
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      # zig is the cross linker; glibc 2.28 runs on Debian 10+, Ubuntu 20.04+
      # and Raspberry Pi OS bullseye or later.
      # 0.19 passes rustc's --fix-cortex-a53-843419 to zig, which rejects it
      # on aarch64; later releases filter it.
      - name: cargo-zigbuild
        run: pip install --user --upgrade cargo-zigbuild
      - name: Build
        run: |
          cargo zigbuild --release --locked -p host-daemon -p guardian \
            --target x86_64-unknown-linux-gnu.2.28 \
            --target aarch64-unknown-linux-gnu.2.28
      - name: Package
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            bin="target/$arch-unknown-linux-gnu/release"
            d="hawk-$V-$arch-linux"
            mkdir -p "pkg/$d" "pkg/core/hawk-core-$V-$arch-linux"
            cp "$bin/host-daemon" "pkg/$d/host-daemon"
            cp "$bin/guardian" "pkg/core/hawk-core-$V-$arch-linux/guardian"
            tar -C pkg -czf "dist/$d.tar.gz" "$d"
            tar -C pkg/core -czf "dist/hawk-core-$V-$arch-linux.tar.gz" "hawk-core-$V-$arch-linux"
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: daemon and app (Windows)
    needs: meta
    runs-on: windows-2022
    env:
      V: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Host daemon
        shell: pwsh
        run: |
          cargo build --release --locked -p host-daemon
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/host-daemon.exe -DestinationPath "dist/hawk-$env:V-x86_64-windows.zip"
      - name: Owner app (NSIS installer)
        shell: pwsh
        working-directory: witness
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Collect the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer" }
          Copy-Item $exe.FullName "dist/hawk-witness-$env:V-x86_64-windows-setup.exe"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  witness-linux:
    name: app (Linux)
    needs: meta
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.meta.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - name: Build .deb and AppImage
        working-directory: witness
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb "dist/hawk-witness-$V-amd64.deb"
          cp target/release/bundle/appimage/*.AppImage "dist/hawk-witness-$V-x86_64.AppImage"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: witness-linux
          path: dist/*

  macos:
    name: daemon and app (macOS)
    needs: meta
    runs-on: macos-14
    env:
      V: ${{ needs.meta.outputs.version }}
      # Optional: with these secrets Tauri signs and notarizes the app;
      # without them the .dmg is ad-hoc signed and Gatekeeper warns.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Host daemon
        run: |
          mkdir -p dist
          for arch in aarch64 x86_64; do
            cargo build --release --locked -p host-daemon --target "$arch-apple-darwin"
            d="hawk-$V-$arch-macos"
            mkdir -p "pkg/$d"
            cp "target/$arch-apple-darwin/release/host-daemon" "pkg/$d/host-daemon"
            tar -C pkg -czf "dist/$d.tar.gz" "$d"
          done
      - name: Owner app (universal .dmg)
        working-directory: witness
        run: |
          # Empty secrets must not reach Tauri as empty variables.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "[ -n \"\${$v}\" ]" || unset "$v"
          done
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
      - name: Collect
        run: |
          dmg="$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)"
          [ -n "$dmg" ] || { echo "no dmg"; exit 1; }
          cp "$dmg" "dist/hawk-witness-$V-universal-macos.dmg"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  android:
    name: app (Android, experimental)
    needs: meta
    runs-on: ubuntu-24.04
    # A release build for arm64 (every current phone), signed with the
    # keystore in ANDROID_KEYSTORE_B64 when it exists, otherwise with a test
    # key made here (updating then needs uninstalling first). A debug build
    # for four ABIs weighed about 700 MB. It never blocks the release.
    continue-on-error: true
    env:
      V: ${{ needs.meta.outputs.version }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # The Gradle project calls back into the CLI that generated it; through
      # npx it would call `npm`, which needs a package.json, so use cargo's.
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the APK
        working-directory: witness
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android init --ci
          # The generated project carries Tauri's default launcher icon. With
          # gen/android in place, `tauri icon` writes HAWK's into its res/.
          cargo tauri icon icons/hawk-launcher.png
          test -f gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cargo tauri android build --apk --target aarch64
      - name: Sign
        run: |
          mkdir -p dist
          # -print -quit, not `| head`: with pipefail a closed pipe fails the step.
          apk="$(find witness/gen/android -name '*release*.apk' -print -quit)"
          [ -n "$apk" ] || { echo "no release APK"; find witness/gen/android -name '*.apk'; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/hawk.keystore"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
            pass="$ANDROID_KEYSTORE_PASSWORD"; alias="${ANDROID_KEY_ALIAS:-hawk}"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set: signing with a test key"
            pass="hawk-test"; alias="hawk"
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=HAWK test build"
          fi
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          # No v4 scheme: it writes a separate .idsig file nobody installs.
          "$tools/apksigner" sign --v4-signing-enabled false --ks "$ks" --ks-pass "pass:$pass" --ks-key-alias "$alias" \
            --out "dist/hawk-witness-$V-android-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "dist/hawk-witness-$V-android-arm64.apk"
          rm -f "$ks"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    name: publish
    needs: [meta, linux, windows, witness-linux, macos, android]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.witness-linux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      V: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      RENDER_DEPLOY_HOOK_LANDING: ${{ secrets.RENDER_DEPLOY_HOOK_LANDING }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Plugin and checksums
        run: |
          cp agent-hook/guardian.ts dist/hawk-opencode-plugin.ts
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the checksums (when the key exists)
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY not set: publishing checksums without a signature"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS -t "hawk $V"
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: GitHub release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "HAWK $V" \
              --notes "Downloads: https://hawkeeper.xyz/downloads/ . Checksums in SHA256SUMS."
          fi
          gh release upload "$TAG" dist/* --clobber
      - name: Redeploy the landing (publishes /downloads/)
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_LANDING" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_LANDING not set: redeploy the landing by hand"
            exit 0
          fi
          # The files are already in the release; a failed hook only delays
          # the downloads page, so warn instead of failing the release.
          hook="$(printf '%s' "$RENDER_DEPLOY_HOOK_LANDING" | tr -d '[:space:]')"
          case "$hook" in
            https://api.render.com/deploy/srv-*) ;;
            *) echo "::warning::RENDER_DEPLOY_HOOK_LANDING is not a Render deploy hook (length ${#hook}); redeploy by hand"; exit 0 ;;
          esac
          if curl -fsS -X POST "$hook" > /dev/null; then
            echo "landing redeploy requested"
          else
            echo "::warning::the landing deploy hook failed; redeploy by hand"
          fi
