# cargo-deny: advisories, licences, bans and sources of every dependency.
# Run with `just audit` or `cargo deny check`. The licence list is ADR-0011
# (docs/adr/0011-dependency-licences.md) and changes only with it.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Every entry needs: the advisory, why the fix cannot be taken, which
# dependency holds it back, and the date to review it again.
ignore = [
    # crypto-bigint 0.5 timing variability. Held back by p256 0.13 (via
    # elliptic-curve 0.13), used for the owner's P-256 signatures in the app,
    # the Core, the daemon and eval. The fix is p256 0.14 (crypto-bigint 0.7),
    # an API migration across five crates that cannot be compiled and tested
    # before the demo. Signing happens on the owner's own device. Review:
    # 2026-11-15 (PENDIENTES.md).
    { id = "RUSTSEC-2026-0387", reason = "p256 0.13 pins crypto-bigint 0.5; migrate to p256 0.14 by 2026-11-15" },
    # proc-macro-error is unmaintained, no safe upgrade. Held back by the GTK
    # bindings (glib-macros, gtk3-macros) that Tauri uses on Linux; it is a
    # build-time macro only. Review: when Tauri moves to GTK 4 bindings.
    { id = "RUSTSEC-2024-0370", reason = "build-time macro of the GTK bindings used by Tauri on Linux; no upgrade exists" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
