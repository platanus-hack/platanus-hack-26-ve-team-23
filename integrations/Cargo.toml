[package]
name = "integrations"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
description = "Firewall adapters (OpenWrt, MikroTik, dry run) and event sinks (Kafka, webhook)."

[features]
default = ["mikrotik", "openwrt", "kafka", "webhook"]
mikrotik = []
openwrt = []
kafka = ["dep:rskafka"]
